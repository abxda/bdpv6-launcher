# BDP v7 "Convergente" · receta única del laboratorio.
# build_portable.py lee este archivo, descarga cada pieza, VERIFICA su hash y arma el portable con el
# MISMO layout de carpetas en Windows, macOS y Linux (el que espera el launcher). Si una pieza no trae
# hash aquí, se toma de su fuente oficial (.sha512 / SHA256SUMS / API de Adoptium).
# Versiones fijadas en la Fase 1 (D:\BDP\v7_spike\SPIKE_REPORT.md, 2026-10-27).

[meta]
version = "7.0.0-dev1"
platforms = ["win-64", "osx-arm64", "linux-64"]
perfiles = ["up", "unir"]          # base = HDFS + Jupyter; up = + Elasticsearch; unir = + Kafka

[python]                           # python-build-standalone (reubicable) + lock universal de uv
version = "3.12.16"
release = "20261026"
lock = "requirements.lock"
[python.triple]
win-64 = "x86_64-pc-windows-msvc"
osx-arm64 = "aarch64-apple-darwin"
linux-64 = "x86_64-unknown-linux-gnu"

[uv]
version = "0.13.6"
[uv.asset]
win-64 = "uv-x86_64-pc-windows-msvc.zip"
osx-arm64 = "uv-aarch64-apple-darwin.tar.gz"
linux-64 = "uv-x86_64-unknown-linux-gnu.tar.gz"

[jdk]                              # un solo JDK para Hadoop, Spark, Kafka y ES (ES_JAVA_HOME)
release = "jdk-17.0.20.1+1"        # Temurin; URL y sha256 por SO desde la API de Adoptium
slim = ["jmods", "lib/src.zip"]

[hadoop]                           # solo HDFS + MapReduce local (Ejercicio_01)
version = "3.3.6"
urls = ["https://dlcdn.apache.org/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz",
        "https://archive.apache.org/dist/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz"]
sha512 = "de3eaca2e0517e4b569a88b63c89fae19cb8ac6c01ff990f1ff8f0cc0f3128c8e8a23db01577ca562a0e0bb1b4a3889f8c74384e609cd55e537aada3dcaa9f8a"
[hadoop.winutils]                  # solo win-64: los mismos binarios que v6 (probados)
url_base = "https://huggingface.co/datasets/abxda/bdp-lab/resolve/main/v7/deps/hadoop-3.3.6-windows"
[hadoop.winutils.sha256]
"winutils.exe" = "496a591eb1e67df2a620f710d529ba6ddfe1c19149e6647cc4e320bb0efd8553"
"hadoop.dll" = "d7ab36a68518748cef142be2da5069b4c763c2cd764c1d2e6ac48c7200405be3"

[pyspark]
version = "4.1.4"                  # SPARK_HOME = <python>/site-packages/pyspark (sin carpeta spark/)

[[jars]]                           # se copian a pyspark/jars: nada de Maven en clase
