# BDP v7 · Kafka KRaft de un nodo (perfil UNIR). Lo coloca el build en
# kafka_kraft/config/kraft/server.properties (la ruta que usa el launcher).
# log.dirs es relativo al cwd con el que el launcher arranca Kafka (kafka_kraft/).
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
num.network.threads=2
num.io.threads=4
log.dirs=./data/data_kraft
num.partitions=1
num.recovery.threads.per.data.dir=1
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# --- Seguro para Windows (probado en el spike v7: apagado forzado + reinicio sin corrupción) ---
# Kafka en Windows no puede renombrar/borrar archivos que tiene mapeados en memoria; por eso aquí
# nada se borra ni se renombra durante una clase.
# 1) Sin retención: ningún segmento pasa a .deleted
log.retention.ms=-1
log.retention.bytes=-1
# 2) Segmentos grandes y sin rotación por tiempo
log.segment.bytes=1073741824
log.roll.ms=9223372036854775807
# 3) Sin compactación (el cleaner renombra .cleaned -> .swap -> .log)
log.cleaner.enable=false
# 4) Borrar topics deshabilitado (el --delete dejaba carpetas -stray que impedían arrancar).
#    Para empezar de cero: botón "Reiniciar Kafka" del launcher, con Kafka detenido.
delete.topic.enable=false
# 5) Metadatos KRaft: sin snapshots por tiempo (el ciclo de 60 min que "apagaba solo" a Kafka) ni borrado
metadata.log.max.snapshot.interval.ms=0
metadata.max.retention.ms=-1
metadata.max.retention.bytes=-1
metadata.log.segment.bytes=1073741824
# Re-registro rápido tras un apagado forzado
broker.session.timeout.ms=9000
